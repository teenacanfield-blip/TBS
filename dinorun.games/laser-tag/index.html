<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laser’s Tag 3D</title>
<style>
:root{--bg:#090b1a;--fg:#eef0fb;--panel:rgba(12,14,34,.72);--blue:#4d9bff;--red:#ff6a4d;--muted:#9aa1c4;--gold:#ffd34d;--chip:#252a4d;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#game{position:fixed;inset:0}
#c{display:block;width:100%;height:100%;cursor:crosshair}
.hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s}
#game.playing .hud{opacity:1}
.top{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:12px;font-weight:700}
.pill{padding:6px 14px;border-radius:99px;background:var(--panel);font-variant-numeric:tabular-nums}
.b{color:var(--blue)}.r{color:var(--red)}
#dock{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
#vest,#ability{padding:10px 14px;border-radius:14px;background:var(--panel);display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px;letter-spacing:.12em;color:var(--muted)}
#vestDots{display:flex;gap:8px}
#vest i{width:16px;height:16px;border-radius:50%;background:#262b4a;box-shadow:inset 0 0 0 2px #3a4170;transition:background .2s,box-shadow .2s}
#vest i.on{background:var(--blue);box-shadow:0 0 12px var(--blue),inset 0 0 0 2px rgba(255,255,255,.5)}
#vest.blink i.on{animation:blink .18s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#ability b{color:#fff}
#ability span{letter-spacing:.02em;font-weight:700;color:var(--fg)}
#abBar{width:80px;height:6px;border-radius:3px;background:#262b4a;overflow:hidden}
#abBar i{display:block;height:100%;width:100%;background:#7dff4a;border-radius:3px}
#cross{position:absolute;left:50%;top:50%;width:0;height:0}
#cross .ring{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border:2px solid rgba(255,255,255,.9);border-radius:50%;transition:transform .08s,border-color .08s;box-shadow:0 0 4px rgba(0,0,0,.6)}
#cross .dot{position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:#fff}
#cross.lock .ring{border-color:var(--red);transform:scale(.78)}
#cross.lock .dot{background:var(--red)}
#cross .hm{position:absolute;left:-18px;top:-18px;width:36px;height:36px;opacity:0}
#cross .hm::before,#cross .hm::after{content:"";position:absolute;left:17px;top:0;width:3px;height:36px;background:linear-gradient(#fff 0 32%,transparent 32% 68%,#fff 68%)}
#cross .hm::before{transform:rotate(45deg)}#cross .hm::after{transform:rotate(-45deg)}
#feed{position:absolute;top:58px;right:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#feed div{padding:5px 12px;border-radius:10px;background:var(--panel);font-weight:600;font-size:14px;transition:opacity .5s}
#feed .good{color:#fff;background:rgba(40,110,255,.75)}
#feed .bad{color:#fff;background:rgba(220,60,40,.75)}
#mini{position:absolute;right:16px;bottom:16px;width:200px;height:140px;border-radius:12px;background:var(--panel)}
#msg{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-weight:800;font-size:19px;text-shadow:0 2px 10px #000}
#big{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:44px;letter-spacing:.04em;color:#fff;text-shadow:0 0 18px var(--blue),0 3px 10px #000;opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s}
#big.show{opacity:1;transform:scale(1)}
#dmg{position:absolute;inset:0;box-shadow:inset 0 0 170px 50px rgba(255,40,30,.8);opacity:0}
#invis{position:absolute;inset:0;box-shadow:inset 0 0 150px 40px rgba(125,255,74,.38);opacity:0;transition:opacity .3s}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,rgba(10,12,30,.5),rgba(6,7,18,.88));color:#fff;overflow:auto}
.ov.side{justify-content:flex-start;background:linear-gradient(90deg,rgba(6,7,18,.94) 0,rgba(6,7,18,.82) 430px,rgba(6,7,18,0) 680px)}
.ov.hide{display:none}
.panel{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;width:100%;max-width:640px;margin:auto}
.panel h2{margin:0;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:.02em;text-shadow:0 0 24px rgba(77,155,255,.7)}
.coins{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc22e 55%,#c98a00);box-shadow:0 0 8px rgba(255,200,40,.6)}
.opt{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:10px;width:100%;max-width:560px;text-align:left}
.opt>span{color:var(--muted);font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;text-align:right}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-weight:800;padding:12px 28px;border:0;border-radius:12px;background:var(--blue);color:#fff;cursor:pointer;font-size:1.1rem;box-shadow:0 0 18px rgba(77,155,255,.5)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.seg button{padding:8px 14px;font-size:.95rem;background:var(--chip);box-shadow:none}
.seg button.on{background:#fff;color:#14172b}
button.ghost{background:var(--chip);box-shadow:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#info{max-width:540px;color:#d5d9f2;line-height:1.5;min-height:4.5em;margin:0}
.ov small{color:var(--muted);max-width:580px;line-height:1.5}
#earn{font-size:1.3rem}
.shop{align-items:stretch;text-align:left;max-width:410px;margin:0}
.shop-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shop-head h2{font-size:2.2rem}
.items{display:flex;flex-direction:column;gap:8px;max-height:min(58vh,560px);overflow:auto;padding-right:4px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06)}
.item b{font-size:1rem}
.item small{grid-column:1;color:var(--muted);line-height:1.4}
.item button{grid-row:1/span 2;grid-column:2;padding:8px 14px;font-size:.9rem;box-shadow:none;white-space:nowrap}
.item button.owned{background:var(--chip)}
.item button.eq{background:#2a7d4f;opacity:1}
.sect{font-weight:800;font-size:.75rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:8px}
.look{display:grid;grid-template-columns:86px 1fr;gap:8px 10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06)}
.look>span{color:var(--muted);font-size:.85rem;font-weight:700}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;padding:0;border-radius:50%;box-shadow:none;border:3px solid transparent}
.sw.on{border-color:#fff}
</style>

</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const V = THREE.Vector3;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- what you own, saved in this browser ---------------- */
const SAVE_KEY = 'lasers-tag-3d';
const BASE_SAVE = {coins:0, owned:['blaster','solid','team'], gun:'blaster', pattern:'solid', glow:'team',
  body:'male', hair:'simpleparted', hairColor:1, skin:0, mode:'team', size:3, diff:'normal', ability:'spider', best:0};
function loadSave(){
  try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'); return {...BASE_SAVE, ...s, owned:[...new Set([...BASE_SAVE.owned, ...(s.owned||[])])]}; }
  catch(e){ return {...BASE_SAVE, owned:[...BASE_SAVE.owned]}; }
}
const save = loadSave();
function store(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

/* ---------------- the shop ---------------- */
const GUNS = [
  {id:'blaster', name:'Blaster', cost:0, cd:.25, beams:1, spread:0, assist:1, width:1, desc:'The one you start with. Steady and reliable.'},
  {id:'zapper', name:'Zapper', cost:150, cd:.12, beams:1, spread:0, assist:.85, width:.7, desc:'Fires twice as fast, with a thinner beam.'},
  {id:'longshot', name:'Longshot', cost:250, cd:.55, beams:1, spread:0, assist:1.7, width:1.7, desc:'Slow to recharge, but it locks on from far away.'},
  {id:'triple', name:'Triple Shot', cost:350, cd:.42, beams:3, spread:.075, assist:1, width:.9, desc:'Three beams at once, in a fan.'},
  {id:'golden', name:'Golden Blaster', cost:600, cd:.17, beams:1, spread:0, assist:1.3, width:1.3, desc:'Fast, sure, and solid gold.'},
];
const PATTERNS = [
  {id:'solid', name:'Plain', cost:0, n:0, desc:'Your team colour with dark side panels.'},
  {id:'stripes', name:'Hoops', cost:100, n:1, desc:'Bands of light and dark all the way round.'},
  {id:'checks', name:'Checks', cost:150, n:3, desc:'A checkerboard in your team colours.'},
  {id:'lightning', name:'Lightning', cost:200, n:2, desc:'A white zigzag across the chest.'},
  {id:'camo', name:'Camo', cost:200, n:4, desc:'Camouflage in your team colours.'},
  {id:'stars', name:'Stars', cost:300, n:5, desc:'A night sky of little lights.'},
];
const GLOWS = [
  {id:'team', name:'Team lights', cost:0, col:null, desc:'Vest lights in your team colour.'},
  {id:'gold', name:'Gold lights', cost:100, col:0xffc53d, desc:'Gold vest lights.'},
  {id:'toxic', name:'Toxic lights', cost:150, col:0x7dff4a, desc:'Bright green vest lights.'},
  {id:'purple', name:'Purple lights', cost:150, col:0xc06bff, desc:'Purple vest lights.'},
  {id:'rainbow', name:'Rainbow lights', cost:400, col:'rainbow', desc:'Vest lights that cycle through every colour.'},
];
const HAIRS = {male:['simpleparted','buzzed','long'], female:['long','buns','simpleparted']};
const HAIR_NAMES = {simpleparted:'Side part', buzzed:'Buzzed', long:'Long', buns:'Buns'};
const HAIR_COLORS = [0x2a1b12,0x4a2f1d,0x121010,0xc79c55,0x8a3a1a,0x6a4a2c];
const SKINS = [[1,1,1],[.9,.8,.7],[.72,.58,.46],[.52,.4,.31]];
const gunOf = id => GUNS.find(g=>g.id===id) || GUNS[0];
const catalog = (kind,id) => (kind==='gun'?GUNS:kind==='pattern'?PATTERNS:GLOWS).find(x=>x.id===id);

/* ---------------- difficulty ---------------- */
const DIFF = {
  easy:  {err:.44, errBot:.3,  cd:[1.4,1], react:[.7,.5],  speed:2.6, turn:2.2, lives:5, pay:1},
  normal:{err:.3,  errBot:.22, cd:[.9,.8], react:[.35,.35], speed:3.2, turn:3,   lives:3, pay:1.5},
  hard:  {err:.17, errBot:.15, cd:[.6,.5], react:[.18,.2], speed:3.8, turn:4.5, lives:2, pay:2},
};
const cfg = {mode:save.mode, size:save.size, diff:save.diff, ability:save.ability};

/* ---------------- sound ---------------- */
let AC = null;
function ac(){ try{ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function tone(type,f0,f1,start,dur,vol){
  const c=ac(); if(!c) return;
  const t=c.currentTime+start, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02);
}
const pew = v => tone('square',1400,180,0,.14,v);
function ding(){ tone('sine',988,1976,0,.09,.16); tone('triangle',1976,2637,.07,.16,.12); }
function zapped(){ tone('sawtooth',420,70,0,.32,.16); tone('square',220,60,.02,.3,.06); }
function whoosh(){ tone('sine',1200,160,0,.5,.14); tone('triangle',300,1400,.05,.4,.06); }
function coinSound(){ tone('square',1319,1319,0,.07,.07); tone('square',1760,1760,.08,.16,.07); }
function hooray(){
  [523,659,784,1047].forEach((f,i)=>tone('triangle',f,f*1.01,i*.14,i==3?.7:.2,.2));
  tone('square',1047,1047*1.01,.42,.7,.05);
  const c=ac(); if(!c) return;
  const n=c.sampleRate*1.8, buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(), bp=c.createBiquadFilter(), g=c.createGain(), t=c.currentTime+.4;
  s.buffer=buf; bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=.7;
  g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(.12,t+.15);
  for(let k=1;k<8;k++) g.gain.linearRampToValueAtTime(k%2?.05:.12,t+.15+k*.12);
  g.gain.exponentialRampToValueAtTime(.001,t+1.5);
  s.connect(bp); bp.connect(g); g.connect(c.destination); s.start(t); s.stop(t+1.6);
}
function whomp(){ tone('sawtooth',233,220,0,.3,.18); tone('sawtooth',208,196,.4,.3,.18); tone('sawtooth',185,175,.8,.3,.18); tone('sawtooth',165,90,1.2,.9,.2); }

/* ---------------- arena: the original 800×560 map, in metres ---------------- */
const PX = 1/30;
const HW = 400*PX, HH = 280*PX;
const tx = px => (px-400)*PX, tz = py => (py-280)*PX;
const WALLS = [{x:360,y:200,w:80,h:160},{x:120,y:100,w:110,h:28},{x:570,y:432,w:110,h:28},{x:590,y:100,w:28,h:110},{x:182,y:350,w:28,h:110},{x:360,y:60,w:80,h:24},{x:360,y:476,w:80,h:24}]
  .map(w=>({x0:tx(w.x),x1:tx(w.x+w.w),z0:tz(w.y),z1:tz(w.y+w.h),h:2.3}));
const T = .6;
const OUTER = [
  {x0:-HW-T,x1:HW+T,z0:-HH-T,z1:-HH,h:3,side:'n'},{x0:-HW-T,x1:HW+T,z0:HH,z1:HH+T,h:3,side:'s'},
  {x0:-HW-T,x1:-HW,z0:-HH,z1:HH,h:3,side:'w'},{x0:HW,x1:HW+T,z0:-HH,z1:HH,h:3,side:'e'}];
const SOLIDS = [...WALLS, ...OUTER];
const R = .36, HIT_R = .55, BOT_HIT_R = .42, LIP = .05;
const inRect = (w,x,z,r) => x>w.x0-r && x<w.x1+r && z>w.z0-r && z<w.z1+r;
// A wall only blocks you while your feet are below its top.
const hitWall = (x,z,r=0,y=0) => x<-HW+r||x>HW-r||z<-HH+r||z>HH-r||WALLS.some(w=>y<w.h-LIP&&inRect(w,x,z,r));
function move(p,dx,dz){ const y=p.y||0; if(!hitWall(p.x+dx,p.z,R,y)) p.x+=dx; if(!hitWall(p.x,p.z+dz,R,y)) p.z+=dz; }
function groundAt(x,z,y){ let g=0; for(const w of WALLS) if(inRect(w,x,z,0)&&y>=w.h-.3&&w.h>g) g=w.h; return g; }
function unstuck(p){
  if(!hitWall(p.x,p.z,R,p.y)) return;
  for(let r=.05;r<1.6;r+=.05) for(let a=0;a<6.28;a+=.4){ const x=p.x+Math.cos(a)*r, z=p.z+Math.sin(a)*r; if(!hitWall(x,z,R,p.y)){ p.x=x; p.z=z; return; } }
}
// Can a see b? Eye to chest, in 3D, so somebody standing on a wall can be seen over it.
function los(a,b){
  const ay=(a.y||0)+1.5, by=(b.y||0)+1.2, d=Math.hypot(b.x-a.x,b.z-a.z,by-ay), n=Math.ceil(d/.15);
  for(let i=1;i<n;i++){ const t=i/n; if(hitWall(a.x+(b.x-a.x)*t,a.z+(b.z-a.z)*t,0,ay+(by-ay)*t)) return false; }
  return true;
}
function rayBox(o,d,b){
  let tmin=0, tmax=1e9;
  for(const [oa,da,a0,a1] of [[o.x,d.x,b.x0,b.x1],[o.y,d.y,0,b.h],[o.z,d.z,b.z0,b.z1]]){
    if(Math.abs(da)<1e-9){ if(oa<a0||oa>a1) return Infinity; continue; }
    let t1=(a0-oa)/da, t2=(a1-oa)/da; if(t1>t2){ const s=t1; t1=t2; t2=s; }
    if(t1>tmin) tmin=t1; if(t2<tmax) tmax=t2; if(tmin>tmax) return Infinity;
  }
  return tmin;
}
function rayWorld(o,d,maxT){
  let t=maxT;
  if(d.y<-1e-6){ const tf=-o.y/d.y; if(tf>0&&tf<t) t=tf; }
  for(const b of SOLIDS){ const tb=rayBox(o,d,b); if(tb<t) t=tb; }
  return t;
}
function rayCyl(o,d,cx,cz,r,y0,y1){
  const ox=o.x-cx, oz=o.z-cz, a=d.x*d.x+d.z*d.z; if(a<1e-9) return Infinity;
  const b=2*(ox*d.x+oz*d.z), c=ox*ox+oz*oz-r*r, disc=b*b-4*a*c; if(disc<0) return Infinity;
  const s=Math.sqrt(disc); let t=(-b-s)/(2*a); if(t<0) t=(-b+s)/(2*a); if(t<0) return Infinity;
  const y=o.y+d.y*t; return (y<y0||y>y1) ? Infinity : t;

function prepBody(gltf, animData){
  let body=null; gltf.scene.traverse(o=>{ if(o.isSkinnedMesh && /hero/i.test(o.name)) body=o; });
  const skel=body.skeleton, names=skel.bones.map(b=>b.name), bp=new Map(), m=new THREE.Matrix4();
  skel.bones.forEach((b,i)=>{ m.copy(skel.boneInverses[i]).invert(); bp.set(b.name,new V().setFromMatrixPosition(m)); });
  // Paint a laser-tag suit onto the body, picked by which bone moves each vertex (Floodlight does its kits this way).
  const geo=body.geometry, pos=geo.attributes.position, si=geo.attributes.skinIndex, sw=geo.attributes.skinWeight;
  const suit=new Float32Array(pos.count*4), v=new V();
  const along=(p,a,b)=>{ const ab=b.clone().sub(a); return p.clone().sub(a).dot(ab)/Math.max(1e-6,ab.lengthSq()); };
  const pel=bp.get('pelvis'), sp1=bp.get('spine_01');
  for(let i=0;i<pos.count;i++){
    let bi=0,bw=-1; for(let k=0;k<4;k++){ const w=sw.getComponent(i,k); if(w>bw){ bw=w; bi=si.getComponent(i,k); } }
    const n=names[bi], side=n.endsWith('_l')?'l':'r'; v.fromBufferAttribute(pos,i).applyMatrix4(body.bindMatrix);
    let c=-1;
    if(n.startsWith('spine')||n.startsWith('clavicle')) c=0;
    else if(n.startsWith('upperarm')) c = along(v,bp.get('upperarm_'+side),bp.get('lowerarm_'+side))<.62 ? 0 : -1;
    else if(n==='pelvis'||n==='root') c = v.y > pel.y+(sp1.y-pel.y)*.35 ? 0 : 1;
    else if(n.startsWith('thigh')||n.startsWith('calf')) c=1;
    else if(n.startsWith('foot')||n.startsWith('ball')) c=2;
    else if(n.startsWith('hand')||/^(index|middle|ring|pinky|thumb)_/.test(n)) c=3;
    if(c>=0) suit[i*4+c]=1;
  }
  geo.setAttribute('aSuit',new THREE.BufferAttribute(suit,4));
  const ul=bp.get('upperarm_l'), ur=bp.get('upperarm_r');
  const dims={chest:bp.get('spine_03').y, waist:sp1.y+(bp.get('spine_02').y-sp1.y)*.15, half:Math.abs(ul.x-ur.x)/2,
    front:Math.sign(bp.get('ball_l').z-bp.get('foot_l').z)||1};

}

const SUIT_COMMON = `
uniform vec3 uJersey,uJerseyDark,uPants,uBoots,uGlove,uGlow,uSkin;
uniform float uGlowAmt,uFlash,uChest,uWaist,uHalf,uPattern;
varying vec4 vSuit;
varying vec3 vBindPos;
float kHash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float kNoise(vec2 p){ vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  return mix(mix(kHash(i),kHash(i+vec2(1.,0.)),u.x),mix(kHash(i+vec2(0.,1.)),kHash(i+vec2(1.,1.)),u.x),u.y); }
vec3 kitPattern(vec3 P){
  vec3 base=uJersey, dark=uJerseyDark, light=mix(uJersey,vec3(1.),.6);
  int id=int(uPattern+.5);
  if(id==1) return mod(floor(P.y/.055+100.),2.)>.5?dark:base;
  if(id==2){ float zz=abs(fract(P.x*2.6+.25)-.5)*.16; float b=P.y-(uChest-.13)-zz; return abs(b)<.028?vec3(1.):(abs(b)<.045?dark:base); }
  if(id==3){ vec2 q=floor(P.xy/.065+100.); return mod(q.x+q.y,2.)>.5?base:dark; }
  if(id==4){ float n=kNoise(P.xy*12.+P.z*5.)*.65+kNoise(P.xy*29.)*.35; return n<.42?dark:(n<.6?base:light); }
  if(id==5){ vec2 q=P.xy/.05+P.z*3.; vec2 c=floor(q); vec2 f=fract(q)-.5; f-=(vec2(kHash(c),kHash(c+3.1))-.5)*.4; return length(f)<.12?vec3(1.):dark*.8; }

function suitMaterial(base,U){
  const m=base.clone();
  m.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,U);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nattribute vec4 aSuit;\nvarying vec4 vSuit;\nvarying vec3 vBindPos;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvSuit=aSuit;\n#ifdef USE_SKINNING\nvBindPos=(bindMatrix*vec4(position,1.0)).xyz;\n#else\nvBindPos=position;\n#endif');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\n'+SUIT_COMMON)
      .replace('#include <map_fragment>',`#include <map_fragment>
        {
          float sw=clamp(vSuit.x+vSuit.y+vSuit.z+vSuit.w,0.,1.);
          vec3 suit=kitPattern(vBindPos)*vSuit.x+uPants*vSuit.y+uBoots*vSuit.z+uGlove*vSuit.w;
          diffuseColor.rgb=mix(diffuseColor.rgb*uSkin,suit,sw);
        }`)
      .replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
        {
          vec3 P=vBindPos;
          float disc=1.-smoothstep(.055,.07,length(vec2(P.x,P.y-uChest+.02)));
          float ring=(1.-smoothstep(.006,.014,abs(length(vec2(P.x,P.y-uChest+.02))-.1)));
          float belt=1.-smoothstep(.01,.02,abs(P.y-uWaist));
          float g=max(disc,ring*.8)*vSuit.x;
          g=max(g,belt*clamp(vSuit.x+vSuit.y,0.,1.));
          vec3 gc=mix(uGlow,vec3(1.),uFlash);
          diffuseColor.rgb=mix(diffuseColor.rgb,gc*.5,g*step(.01,uGlowAmt));

}

const UP=new V(0,1,0);

function updateFx(dt){

/* ---------------- shooting ---------------- */
const hidden = q => q.invisT>0;
function muzzlePos(p){ return p.ch.muzzle.getWorldPosition(new V()); }
function camDir(){ return new V(Math.cos(ps[0].ang)*Math.cos(pitch),Math.sin(pitch),Math.sin(ps[0].ang)*Math.cos(pitch)); }
// Who would this shot tag? A direct hit on a fat hitbox first, then a gentle aim assist (never onto somebody invisible).
function playerTarget(d=camDir(),assist=true){
  const me=ps[0], o=camera.position.clone(), muz=muzzlePos(me), gun=gunOf(save.gun);
  const tMin=camDist*.9, tWorld=rayWorld(o,d,90);
  let target=null, tHit=Infinity;
  for(const q of ps){ if(!q.alive||q.team===me.team) continue;
    const t=rayCyl(o,d,q.x,q.z,HIT_R,q.y+.05,q.y+2); if(t>tMin&&t<tWorld&&t<tHit){ tHit=t; target=q; } }
  if(target){ const end=o.clone().addScaledVector(d,tHit); if(!segBlocked(muz,end)) return {target,end,muz}; target=null; }
  if(assist){
    let best=null, bestA=Infinity;
    for(const q of ps){ if(!q.alive||q.team===me.team||hidden(q)) continue;
      const c=new V(q.x,q.y+1.15,q.z), v=c.clone().sub(o), t=v.dot(d); if(t<tMin) continue;
      const lat=v.addScaledVector(d,-t).length(), allow=(.4+t*.06)*gun.assist;
      if(lat<allow&&lat/t<bestA&&!segBlocked(muz,c)){ best=q; bestA=lat/t; } }
    if(best) return {target:best,end:new V(best.x,best.y+1.15,best.z),muz};
  }
  let end=o.clone().addScaledVector(d,Math.min(tWorld,90));
  const dd=end.clone().sub(muz), L=dd.length(); dd.divideScalar(L); const tb=rayWorld(muz,dd,L); if(tb<L) end=muz.clone().addScaledVector(dd,tb);
  return {target:null,end,muz};
}

  const dirs=gun.beams===1?[d0]:[-1,0,1].map(k=>d0.clone().applyAxisAngle(UP,k*gun.spread));
  dirs.forEach((d,i)=>{ const r=playerTarget(d,gun.beams===1||i===1); spawnBeam(r.muz,r.end,0,gun.width); if(r.target) hits.add(r.target); });
  for(const t of hits) tag(t,me);
  pew(.12); me.recoil=1; myShots++;
}
function botShoot(p){
  const muz=muzzlePos(p), tg=p.tgt, D=DIFF[cfg.diff];
  const err=(Math.random()-.5)*(tg.id===0?D.err:D.errBot);
  const d=new V(tg.x,tg.y+1.15,tg.z).sub(muz).normalize().applyAxisAngle(UP,err);
  const tWorld=rayWorld(muz,d,60); let hit=null, tHit=tWorld;
  for(const q of ps){ if(!q.alive||q.team===p.team) continue; const t=rayCyl(muz,d,q.x,q.z,BOT_HIT_R,q.y+.05,q.y+2); if(t<tHit){ tHit=t; hit=q; } }
  spawnBeam(muz,muz.clone().addScaledVector(d,tHit),p.team);
  const me=ps[0], dist=Math.hypot(p.x-me.x,p.z-me.z); pew(.06*clamp(1-dist/30,.25,1)); p.recoil=1;
  if(hit) tag(hit,p);
}
function tag(q,by){
  if(!q.alive) return;
  tagRing(q,by.team);
  if(q.id===0){
    if(q.inv>0) return;
    q.lives--; q.inv=1.5; q.flash=1; hurt=1; shake=.25; zapped(); updateVest();
    if(q.lives>0){ feed(`${by.name} tagged you — ${q.lives} light${q.lives>1?'s':''} left`,'bad'); return; }
  }

  setFull(q.ch,q.ch.A.hit);
  if(by.id===0){ myTags++; ding(); hmT=.25; big('TAGGED!'); feed(cfg.mode==='practice'?`Target ${myTags}!`:`You tagged ${q.name}!`,'good'); if(q.dummy) q.respawnT=1.6; }
  else if(q.id===0) feed(`${by.name} tagged you — you’re out!`,'bad');

/* ---------------- update ---------------- */
function updatePlayer(dt){
  const me=ps[0]; if(!me.alive) return;
  if(keys.arrowleft) me.ang-=2.6*dt; if(keys.arrowright) me.ang+=2.6*dt;
  let f=0,s=0; if(keys.w||keys.arrowup) f++; if(keys.s||keys.arrowdown) f--; if(keys.d) s++; if(keys.a) s--;
  let mx=Math.cos(me.ang)*f-Math.sin(me.ang)*s, mz=Math.sin(me.ang)*f+Math.cos(me.ang)*s; const m=Math.hypot(mx,mz);
  if(m>0){ mx/=m; mz/=m; }
  me.sprinting=!!keys.shift&&f>0&&!me.cling; const sp=me.sprinting?6.4:4.5;

  // Spider: walk into a wall to climb it, and stay stuck on while you shoot. Walk away from it to drop.
  let wall=null, nx=0, nz=0;
  if(me.ability==='spider') for(const w of WALLS){
    if(me.y>w.h+.12) continue;
    const cx=clamp(me.x,w.x0,w.x1), cz=clamp(me.z,w.z0,w.z1), dx=me.x-cx, dz=me.z-cz, d=Math.hypot(dx,dz);
    if(d<R+.12&&d>1e-4){ wall=w; nx=dx/d; nz=dz/d; break; }
  }
  const into = wall&&m>0 ? -(mx*nx+mz*nz) : 0;
  if(wall&&into>.35&&!me.cling&&me.y<wall.h-LIP){ me.cling=true; me.vy=0; }
  if(me.cling){
    if(!wall||into<-.35) me.cling=false;
    else if(into>.35) me.y=Math.min(me.y+2.8*dt,wall.h+.04);
  }
  if(m>0) move(me,mx*sp*dt,mz*sp*dt);
  const g=groundAt(me.x,me.z,me.y);
  if(me.cling&&g>0){ me.cling=false; me.y=g; me.vy=0; }       // climbed over the top
  if(!me.cling){
    if(me.y>g+.001||me.vy>0){ me.vy-=20*dt; me.y+=me.vy*dt; if(me.y<=g){ me.y=g; me.vy=0; } }
    else { me.y=g; me.vy=0; }
  }
  unstuck(me);
  me.air=me.cling||me.y>groundAt(me.x,me.z,me.y)+.05;
  me.speedNow=m>0?sp:0; me.moveDir=f<0?-1:1; me.pitch=pitch;
  me.cd-=dt; me.inv-=dt;

  me.abilCd=Math.max(0,me.abilCd-dt); me.invisT=Math.max(0,me.invisT-dt);
  if(keys.e&&me.ability==='gecko'&&me.abilCd<=0){ me.invisT=10; me.abilCd=25; whoosh(); big('INVISIBLE'); }
  // A click while the blaster recharges is remembered and fires the moment it is ready.
  if((mouse.down||mouse.queued||keys[' '])&&me.cd<=0){ playerShoot(); me.cd=gunOf(save.gun).cd; mouse.queued=false; }
}
function updateBots(dt){
  const D=DIFF[cfg.diff];
  for(const p of ps){
    if(p.id===0) continue;
    if(!p.alive){
      if(p.dummy&&p.respawnT>0){ p.respawnT-=dt; if(p.respawnT<=0){ const w=randWp(ps[0]); Object.assign(p,{x:w.x,z:w.z,alive:true,outT:0,beamed:false,wp:null});
        p.ch.root.visible=true; setFull(p.ch,null); p.ch.U.uGlowAmt.value=2.4; } }
      continue;
    }
    p.cd-=dt; p.think-=dt; p.react-=dt; p.invisT=Math.max(0,p.invisT-dt); p.abilCd-=dt;
    if(p.think<=0){
      p.think=.3;
      let best=null,bd=1e9;
      if(!p.dummy) for(const q of ps){
        if(!q.alive||q.team===p.team) continue;
        const d=Math.hypot(q.x-p.x,q.z-p.z);
        if(hidden(q)&&d>2.4) continue;
        if(d<bd&&los(p,q)){ bd=d; best=q; }
      }
      if(best&&best!==p.tgt) p.react=D.react[0]+Math.random()*D.react[1];
      p.tgt=best;
      if(!p.wp||Math.hypot(p.wp.x-p.x,p.wp.z-p.z)<.6||Math.random()<.2){
        if(best&&Math.random()<.5) p.wp={x:best.x+(Math.random()-.5)*6.6,z:best.z+(Math.random()-.5)*6.6}; else p.wp=randWp();
      }
      if(p.ability==='gecko'&&best&&p.abilCd<=0&&Math.random()<.3){ p.invisT=10; p.abilCd=25; }
    }
    let moved=false;
    if(p.wp){
      const a=Math.atan2(p.wp.z-p.z,p.wp.x-p.x), ox=p.x, oz=p.z, sp=p.dummy?D.speed*.8:D.speed;
      move(p,Math.cos(a)*sp*dt,Math.sin(a)*sp*dt); moved=Math.hypot(p.x-ox,p.z-oz)>1e-3; p.moveAng=a;
      if(!moved||hitWall(p.x+Math.cos(a)*.45,p.z+Math.sin(a)*.45,R-.06)) p.wp=randWp();
    }
    if(p.tgt&&p.tgt.alive){
      const want=Math.atan2(p.tgt.z-p.z,p.tgt.x-p.x), diff=angDiff(want,p.ang);
      p.ang+=clamp(diff,-D.turn*dt,D.turn*dt); p.aiming=true;
      if(Math.abs(diff)<.15&&p.cd<=0&&p.react<=0){ botShoot(p); p.cd=D.cd[0]+Math.random()*D.cd[1]; }
    }else{ p.aiming=false; if(p.wp) p.ang+=clamp(angDiff(p.moveAng,p.ang),-6*dt,6*dt); }
    p.speedNow=moved?D.speed:0; p.moveDir=Math.cos(p.moveAng-p.ang)<-.3?-1:1;
  }
  for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){
    const a=ps[i], b=ps[j]; if(!a.alive||!b.alive||Math.abs(a.y-b.y)>1) continue;
    const dx=b.x-a.x, dz=b.z-a.z, d=Math.hypot(dx,dz);
    if(d<.75&&d>1e-4){ const k=(.75-d)/2/d; move(a,-dx*k,-dz*k); move(b,dx*k,dz*k); }
  }
}
function checkEnd(){

function animateChar(p,dt,time){
  const ch=p.ch, A=ch.A, w=ch.w;
  ch.root.position.set(p.x,p.y||0,p.z); ch.root.rotation.y=Math.PI/2-p.ang+(ch.front<0?Math.PI:0);
  w.move=damp(w.move,p.speedNow>.3?1:0,10,dt); w.sprint=damp(w.sprint,p.sprinting?1:0,8,dt);
  w.full=damp(w.full,ch.fullAct?1:0,12,dt); w.aim=damp(w.aim,p.aiming||!p.alive?1:0,8,dt); w.air=damp(w.air,p.air?1:0,10,dt);
  const k=1-w.full, ground=1-w.air;
  A.idle.setEffectiveWeight((1-w.move)*k*ground); A.jog.setEffectiveWeight(w.move*(1-w.sprint)*k*ground); A.sprint.setEffectiveWeight(w.move*w.sprint*k*ground);
  A.air.setEffectiveWeight(w.air*k);
  A.jog.timeScale=p.moveDir*clamp(p.speedNow/4.2,.7,1.3);
  const pt=p.id===0?p.pitch:0, up=clamp(pt/.75,0,1), dn=clamp(-pt/.6,0,1);
  A.aimU.setEffectiveWeight(w.aim*up*k); A.aimD.setEffectiveWeight(w.aim*dn*k); A.aimN.setEffectiveWeight(w.aim*(1-up-dn)*k);
  A.pidle.setEffectiveWeight((1-w.aim)*k);

  p.recoil=Math.max(0,(p.recoil||0)-dt*8); ch.gun.g.position.z=-.04*p.recoil;
  p.flash=Math.max(0,(p.flash||0)-dt*3);

  if(ch.rainbow) ch.U.uGlow.value.setHSL((time*.18)%1,1,.55);

const camLook=new V(); let viewShift=0;
function updateCamera(dt,time){
  const me=ps[0];
  const shift = state==='shop' ? 1 : 0;
  if(shift!==viewShift){ viewShift=shift; if(shift) camera.setViewOffset(innerWidth,innerHeight,-innerWidth*.2,0,innerWidth,innerHeight); else camera.clearViewOffset(); }
  if((state==='play'||state==='paused')&&me&&me.alive){
    const d=camDir(), right=new V(-Math.sin(me.ang),0,Math.cos(me.ang));
    const pivot=new V(me.x,me.y+1.62,me.z).addScaledVector(right,.55), back=d.clone().negate();
    let dist=3; const t=rayWorld(pivot,back,dist+.3); if(t<dist+.3) dist=Math.max(.5,t-.3);
    camDist=dist;
    camera.position.copy(pivot).addScaledVector(back,dist);
    if(camera.position.y<.25) camera.position.y=.25;
    if(shake>0){ camera.position.x+=(Math.random()-.5)*shake*.3; camera.position.y+=(Math.random()-.5)*shake*.3; shake=Math.max(0,shake-dt); }
    camLook.copy(camera.position).addScaledVector(d,6); camera.lookAt(camLook);
    return;
  }
  let pos, look;
  if(state==='shop'&&me){
    const a=me.ang+.35*Math.sin(time*.5); pos=new V(me.x+Math.cos(a)*2.5,1.3,me.z+Math.sin(a)*2.5); look=new V(me.x,1.02,me.z);
  }else if(state==='over'&&me&&me.alive&&winTeam===0){
    const a=me.ang+Math.PI*.15+time*.3; pos=new V(me.x+Math.cos(a)*3.4,me.y+1.7,me.z+Math.sin(a)*3.4); look=new V(me.x,me.y+1.05,me.z);
  }else{ const a=time*.07; pos=new V(Math.cos(a)*18,14.5,Math.sin(a)*15); look=new V(0,0,0); }
  camera.position.lerp(pos,1-Math.exp(-2.6*dt)); camLook.lerp(look,1-Math.exp(-3.2*dt)); camera.lookAt(camLook);
}

  const me=ps[0]; if(!me) return;
  if(cfg.mode==='practice'){
    const s=Math.ceil(practiceT); $('pillL').textContent=`Time ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; $('pillR').textContent=`Tags ${myTags}`;
  }else{
    $('pillL').textContent=`Blue team: ${ps.filter(p=>p.alive&&p.team===0).length}`; $('pillR').textContent=`Red team: ${ps.filter(p=>p.alive&&p.team===1).length}`;
  }
  const lock=state==='play'&&me.alive&&!!playerTarget().target;
  $('cross').classList.toggle('lock',lock);
  $('cross').style.display=me.alive&&state!=='over'?'':'none';
  hmT=Math.max(0,hmT-dt); $('cross').querySelector('.hm').style.opacity=hmT>0?1:0;
  bigT=Math.max(0,bigT-dt); if(bigT<=0) $('big').classList.remove('show');
  hurt=Math.max(0,hurt-dt*1.6); $('dmg').style.opacity=hurt;
  $('invis').style.opacity=me.invisT>0&&me.alive?1:0;
  $('vest').classList.toggle('blink',me.inv>0&&me.alive);
  $('msg').textContent=(!me.alive&&state==='play')?'You were tagged — you’re out! Spectating…':'';
  const ab=$('ability'); ab.hidden=me.ability==='none'||!me.alive;
  if(me.ability==='gecko'){
    $('abName').textContent='GECKO';
    $('abText').textContent=me.invisT>0?`Invisible ${Math.ceil(me.invisT)}s`:me.abilCd>0?`Ready in ${Math.ceil(me.abilCd)}s`:'Press E to vanish';
    $('abBar').firstChild.style.width=(me.invisT>0?me.invisT/10:1-me.abilCd/25)*100+'%';
    $('abBar').hidden=false;
  }else if(me.ability==='spider'){
    $('abName').textContent='SPIDER';
    $('abText').textContent=me.cling?'Clinging — walk away to drop':'Walk into a wall to climb it';
    $('abBar').hidden=true;
  }
  drawMini();
}

/* ---------------- menus ---------------- */
const INFO = {
  team:()=>cfg.size===1
    ? `Just you against one opponent. A tag puts them out; your vest takes ${DIFF[cfg.diff].lives}. A win pays coins.`
    : `You and ${cfg.size-1} teammate${cfg.size>2?'s':''} in blue against ${cfg.size} in red. One tag and an opponent is out; your vest takes ${DIFF[cfg.diff].lives}. Last team standing wins, and a win pays coins.`,
  ability:()=>(cfg.ability==='gecko'
    ? 'Gecko: press E to turn invisible for 10 seconds. Nobody can lock on to you, and it recharges in 25 seconds.'
    : 'Spider: walk into a wall to climb it, cling on while you shoot, or climb right on top. Walk away from the wall to drop.')
    + ` ${cfg.size} vs ${cfg.size}, and some of the red team can go invisible too.`,
  practice:()=>`60 seconds of target practice. The red targets wander about and never shoot back. Tag as many as you can. Best so far: ${save.best}. Practice does not pay coins.`,
};
function showPanel(name){
  for(const id of ['menu','shop','note']) $(id).hidden=id!==name;
  $('ov').classList.toggle('side',name==='shop');
  $('ov').classList.remove('hide');
}
function renderMenu(){
  if(cfg.mode==='ability'&&cfg.ability==='none') cfg.ability='spider';
  document.querySelectorAll('.seg[data-set]').forEach(seg=>{ const k=seg.dataset.set;
    seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(cfg[k])===b.dataset.v)); });
  $('rowSize').hidden=cfg.mode==='practice';
  $('rowAbility').hidden=cfg.mode==='team';
  $('abNone').hidden=cfg.mode!=='practice';
  $('rowDiff').hidden=cfg.mode==='practice';
  $('info').textContent=INFO[cfg.mode]();
  $('coinsMenu').textContent=save.coins;
}
function openMenu(){
  state='menu'; $('game').classList.remove('playing');
  if(document.pointerLockElement) document.exitPointerLock();
  resetRound(); renderMenu(); showPanel('menu');
}
function showNote(title,text,earnHTML,buttons){
  $('noteT').textContent=title; $('noteS').textContent=text; $('earn').innerHTML=earnHTML||''; $('earn').hidden=!earnHTML;
  const box=$('noteBtns'); box.innerHTML='';
  buttons.forEach(([label,fn,primary])=>{ const b=document.createElement('button'); b.textContent=label; if(primary) b.className='primary'; else b.className='ghost'; b.onclick=fn; box.appendChild(b); });
  showPanel('note');
}
function startRound(){
  ac(); resetRound(); state='play'; $('ov').classList.add('hide'); $('game').classList.add('playing'); requestLock();
}
function pause(){
  state='paused'; mouse.down=false;
  showNote('Paused','Take a breather.','',[['Resume',resume,true],['Quit to menu',openMenu]]);
}
function resume(){ state='play'; $('ov').classList.add('hide'); requestLock(); }
function showResult(){
  const me=ps[0];
  if(cfg.mode==='practice'){
    const acc=myShots?Math.round(myTags/myShots*100):0;
    showNote('Time!',`You tagged ${myTags} target${myTags===1?'':'s'} in 60 seconds (${acc}% of your shots landed). Best: ${save.best}.`,'',[['Play again',startRound,true],['Menu',openMenu]]);
    return;
  }
  const head=winTeam==0?'🎉 Blue team wins!':'Red team wins!';
  const txt=(me.alive?'You survived the round.':'You were tagged and left the game.')+` You tagged ${myTags} opponent${myTags===1?'':'s'}.`;
  showNote(head,txt,earned?`<span class="coin"></span> +${earned} coins`:'',[['Play again',startRound,true],['Menu',openMenu]]);
  if(earned) coinSound();
}

let shopTab='guns';
const hex = n => '#'+n.toString(16).padStart(6,'0');
function itemRow(kind,it,equipped,desc){
  const owned=save.owned.includes(it.id);
  const btn = equipped ? '<button class="eq" disabled>Equipped</button>'
    : owned ? `<button class="owned" data-equip="${kind}:${it.id}">Equip</button>`
    : `<button data-buy="${kind}:${it.id}"${save.coins<it.cost?' disabled':''}>${it.cost} coins</button>`;
  return `<div class="item"><b>${esc(it.name)}</b>${btn}<small>${esc(desc)}</small></div>`;
}
function renderShop(){
  $('coinsShop').textContent=save.coins;
  $('shopTabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===shopTab));
  let h='';
  if(shopTab==='guns'){
    h=GUNS.map(g=>itemRow('gun',g,save.gun===g.id,`${g.desc} Recharge ${g.cd}s${g.beams>1?`, ${g.beams} beams`:''}.`)).join('');
  }else{
    const skinHex=SKINS.map(([r,g,b])=>`rgb(${Math.round(232*r)},${Math.round(180*g)},${Math.round(146*b)})`);
    h=`<div class="sect">Look — free</div>
      <div class="look"><span>Body</span><div class="seg">${['male','female'].map(b=>`<button data-look="body:${b}" class="${save.body===b?'on':''}">${b==='male'?'Boy':'Girl'}</button>`).join('')}</div>
      <span>Hair</span><div class="seg">${HAIRS[save.body].map(x=>`<button data-look="hair:${x}" class="${lookFromSave().hair===x?'on':''}">${HAIR_NAMES[x]}</button>`).join('')}</div>
      <span>Hair colour</span><div class="swatches">${HAIR_COLORS.map((c,i)=>`<button class="sw ${save.hairColor===i?'on':''}" data-look="hairColor:${i}" style="background:${hex(c)}" aria-label="Hair colour ${i+1}"></button>`).join('')}</div>
      <span>Skin</span><div class="swatches">${skinHex.map((c,i)=>`<button class="sw ${save.skin===i?'on':''}" data-look="skin:${i}" style="background:${c}" aria-label="Skin tone ${i+1}"></button>`).join('')}</div></div>
      <div class="sect">Suit pattern</div>${PATTERNS.map(p=>itemRow('pattern',p,save.pattern===p.id,p.desc)).join('')}
      <div class="sect">Vest lights</div>${GLOWS.map(g=>itemRow('glow',g,save.glow===g.id,g.desc)).join('')}`;
  }
  $('shopList').innerHTML=h;
}
function equip(kind,id){ save[kind]=id; store(); rebuildYou(); }
$('shop').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.tab){ shopTab=b.dataset.tab; }
  else if(b.dataset.buy){ const [k,id]=b.dataset.buy.split(':'), it=catalog(k,id); if(it&&save.coins>=it.cost){ save.coins-=it.cost; save.owned.push(id); coinSound(); equip(k,id); } }
  else if(b.dataset.equip){ const [k,id]=b.dataset.equip.split(':'); equip(k,id); }
  else if(b.dataset.look){ const [k,v]=b.dataset.look.split(':'); save[k]=(k==='body'||k==='hair')?v:+v; store(); rebuildYou(); }
  else return;
  renderShop();
});
document.querySelectorAll('.seg[data-set] button').forEach(b=>b.onclick=()=>{
  const k=b.parentElement.dataset.set; cfg[k]=k==='size'?+b.dataset.v:b.dataset.v; save[k]=cfg[k]; store();
  renderMenu(); if(state==='menu') resetRound();
});
$('go').onclick=()=>{ if(state==='menu') startRound(); };
$('shopBtn').onclick=()=>{ if(state!=='menu') return; state='shop'; shopTab='guns'; renderShop(); showPanel('shop'); };
$('shopBack').onclick=()=>{ state='menu'; renderMenu(); showPanel('menu'); };

/* ---------------- input ---------------- */
function requestLock(){
  if(noLock) return;
  try{ const r=canvas.requestPointerLock(); if(r&&r.catch) r.catch(()=>{ noLock=true; }); }catch(e){ noLock=true; }
}
const SENS=.0024;
document.addEventListener('mousemove',e=>{
  if(state!=='play'||!ps[0]||!ps[0].alive) return;
  if(!locked&&!noLock) return;
  ps[0].ang+=e.movementX*SENS; pitch=clamp(pitch-e.movementY*SENS,-.6,.75);
});
canvas.addEventListener('mousedown',e=>{
  if(e.button!==0||state!=='play') return;
  ac(); if(!locked) requestLock();
  mouse.down=true; mouse.queued=true;
});
addEventListener('mouseup',e=>{ if(e.button===0) mouse.down=false; });
document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===canvas;
  if(!locked&&state==='play') pause();
});
document.addEventListener('pointerlockerror',()=>{ noLock=true; });
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); keys[k]=true; if(k.startsWith('arrow')||k===' ') e.preventDefault();
  if(k==='enter'&&!e.repeat&&!$('ov').classList.contains('hide')){
    const b=document.querySelector('.panel:not([hidden]) button.primary:not(:disabled)'); if(b){ e.preventDefault(); b.click(); }
  }
  if(k==='escape'){
    if(state==='play'){ if(document.pointerLockElement) document.exitPointerLock(); else pause(); }
    else if(state==='shop') $('shopBack').click();
  }
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; mouse.down=false; });

/* ---------------- main loop ---------------- */
let last=0, time=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0); last=t;
  tick(dt);
  requestAnimationFrame(frame);
}
function tick(dt){
  time+=dt;
  if(state==='play'){ updatePlayer(dt); updateBots(dt); if(cfg.mode==='practice') updatePractice(dt); else checkEnd(); }
  if(state==='over'){ endTimer-=dt; if(endTimer<=0&&endTimer>-1){ endTimer=-5; showResult(); } }
  if(state!=='paused'&&state!=='loading') for(const p of ps) if(p.ch.root.visible) animateChar(p,dt,time);
  updateFx(state==='paused'?0:dt);
  updateCamera(dt,time);
  if(state!=='loading') updateHUD(dt);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);

/* ---------------- load ---------------- */
(async()=>{
  try{
    const files=['male.glb','female.glb','hair_simpleparted.glb','hair_buzzed.glb','hair_long.glb','hair_buns.glb'];
    // Load model textures through <img> rather than fetch(), which some locked-down pages refuse for blob: URLs.
    const cib=window.createImageBitmap; window.createImageBitmap=undefined;
    let loaded; try{ loaded=await Promise.all(files.map(loadGLB)); } finally { window.createImageBitmap=cib; }
    const [male,female,hs,hz,hl,hb]=loaded;
    const animData=window.EMBED_ANIMS||await (await fetch('models/anims.json')).json();
    BODIES.male=prepBody(male,animData); BODIES.female=prepBody(female,animData);
    HAIR.simpleparted=firstSkinned(hs); HAIR.buzzed=firstSkinned(hz); HAIR.long=firstSkinned(hl); HAIR.buns=firstSkinned(hb);
    const rnd=a=>a[Math.floor(Math.random()*a.length)];
    randLook=()=>{ const body=Math.random()<.5?'male':'female'; return {body,hair:rnd(HAIRS[body]),hairColor:rnd(HAIR_COLORS),skin:Math.floor(Math.random()*SKINS.length),pattern:0,glow:'team',gun:'blaster'}; };
    rebuildYou();
    for(let i=0;i<2;i++) getBot(0,i); for(let i=0;i<3;i++) getBot(1,i);
    openMenu();
    $('go').disabled=false; $('go').textContent='Start'; $('shopBtn').disabled=false;
    window.__ltReady=true;
  }catch(err){
    console.error(err); $('info').textContent='Could not load the players: '+err.message;
  }
})();
window.__lt={tick,get ps(){return ps;},get state(){return state;},cfg,save,scene,camera,renderer,playerTarget,tag,get pitch(){return pitch;},set pitch(v){pitch=v;},mouse,keys,openMenu,startRound};
</script>
<script src="../../gamepad.js?v=2"></script>
<script>window.Pad && Pad.start({ a: 'Space', b: 'Escape', start: 'Enter', rb: 'ShiftLeft', x: 'KeyE' }, { menu: '#ov button' });</script>
</body>
