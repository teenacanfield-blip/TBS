<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Thirsty Bear Hub — free browser games by Thirsty Bear Studios</title>
<meta name="description" content="Play The 13 Dynasties and Ugg &amp; the Undersaucer free in your browser — no download, no account, nothing to install. Plus demos you can review." />

<!-- What a link to the hub looks like when it is pasted into a chat. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Thirsty Bear Hub" />
<meta property="og:title" content="Thirsty Bear Hub" />
<meta property="og:description" content="Free browser games by Thirsty Bear Studios. Nothing to install." />
<meta name="twitter:card" content="summary" />

<!-- The bear, as a tab icon. Inline so there is no extra file to lose. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230a0d13'/%3E%3Crect x='2' y='2' width='3' height='3' fill='%235c3b21'/%3E%3Crect x='11' y='2' width='3' height='3' fill='%235c3b21'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%2396663f'/%3E%3Crect x='5' y='6' width='2' height='2' fill='%23241a12'/%3E%3Crect x='9' y='6' width='2' height='2' fill='%23241a12'/%3E%3Crect x='5' y='9' width='6' height='4' fill='%23d7b189'/%3E%3Crect x='7' y='9' width='2' height='2' fill='%23241a12'/%3E%3C/svg%3E" />

<link rel="stylesheet" href="style.css?v=23" />
</head>
<body>

<header class="topbar">
  <button id="side-toggle" class="icon-btn" aria-label="Show library" aria-expanded="false">
    <svg viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true">
      <rect y="0" width="7" height="1"/><rect y="3" width="7" height="1"/><rect y="6" width="7" height="1"/>
    </svg>
  </button>

  <a class="brand" href="#/home">
    <span class="brand-mark" aria-hidden="true">
      <!-- The bear, thirsty. Drawn on a 16x16 grid like everything else. -->
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
        <rect x="2" y="2" width="3" height="3" fill="#5c3b21"/>
        <rect x="11" y="2" width="3" height="3" fill="#5c3b21"/>
        <rect x="3" y="3" width="10" height="10" fill="#96663f"/>
        <rect x="2" y="5" width="12" height="6" fill="#96663f"/>
        <rect x="5" y="6" width="2" height="2" fill="#241a12"/>
        <rect x="9" y="6" width="2" height="2" fill="#241a12"/>
        <rect x="5" y="9" width="6" height="4" fill="#d7b189"/>
        <rect x="7" y="9" width="2" height="2" fill="#241a12"/>
        <rect x="11" y="7" width="5" height="8" fill="#7ce6ff"/>
        <rect x="11" y="7" width="5" height="2" fill="#c9f6ff"/>
      </svg>
    </span>
    <!-- Filled in by app.js with the same pixel letters the titles use. -->
    <span class="brand-text" id="brand-text"></span>
  </a>

  <nav class="tabs" aria-label="Sections">
    <a href="#/home" data-tab="home">Home</a>
    <a href="#/library" data-tab="library">Library</a>
    <a href="#/demos" data-tab="demos">Demos</a>
  </nav>

  <div class="search">
    <svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="1" y="0" width="4" height="1"/><rect x="0" y="1" width="1" height="4"/>
      <rect x="5" y="1" width="1" height="4"/><rect x="1" y="5" width="4" height="1"/>
      <rect x="5" y="5" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/>
      <rect x="7" y="7" width="1" height="1"/>
    </svg>
    <input id="search" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off" spellcheck="false" />
  </div>

  <div class="who" id="who" title="Your stats live in this browser only">
    <span class="who-dot" aria-hidden="true"></span>
    <span id="who-text">Player</span>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Library">
    <div class="side-head">
      <span>Library</span>
      <span class="side-count" id="side-count"></span>
    </div>
    <div class="side-list" id="side-list"></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main id="view" class="view" tabindex="-1"></main>
</div>

<!-- The game itself, played in place — like hitting Play in a launcher. -->
<div id="player" class="player" hidden>
  <iframe id="player-frame" title="Game" allow="fullscreen; autoplay; gamepad"></iframe>
  <div class="player-bar" id="player-bar">
    <button id="player-exit" class="pbtn"><span id="player-exit-icon"></span> Exit game</button>
    <span class="player-title" id="player-title"></span>
    <span class="player-clock" id="player-clock">0:00</span>
    <a id="player-pop" class="pbtn ghost" target="_blank" rel="noopener" title="Open in its own tab"></a>
  </div>
</div>

<script src="art.js?v=23"></script>
<script src="games.js?v=23"></script>
<!-- Config first, then the account layer that reads it, then the hub. -->
<script src="supabase-config.js?v=23"></script>
<script src="accounts.js?v=23"></script>
<script src="app.js?v=23"></script>
</body>
</html>
