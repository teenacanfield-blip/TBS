<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="dark" />
<title>Pokémon Rip and Go</title>
<meta name="description" content="A fan-made card-pack collector. Buy packs, rip them open, keep five, and battle your way to the next shelf. Load your own sprite sheets in the Sprite Lab." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230c1020'/%3E%3Crect x='3' y='2' width='10' height='12' fill='%23ffd166'/%3E%3Crect x='4' y='3' width='8' height='10' fill='%231b2440'/%3E%3Crect x='6' y='5' width='4' height='4' fill='%235ce08a'/%3E%3Crect x='5' y='10' width='6' height='1' fill='%23ffd166'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
<div id="wrap">
  <!-- Menus, shops, packs, battles and the town all go into this one canvas,
       drawn with the game's own pixel font, so nothing is ever in the wrong
       typeface at the wrong size. There is no DOM text below this line — the
       Sprite Lab is a separate page, because a tool is allowed to be a tool. -->
  <canvas id="c" width="384" height="216"></canvas>

  <div id="touch" aria-hidden="true">
    <button type="button" class="t-up"    data-key="up"    aria-label="Up">&#9650;</button>
    <button type="button" class="t-left"  data-key="left"  aria-label="Left">&#9664;</button>
    <button type="button" class="t-right" data-key="right" aria-label="Right">&#9654;</button>
    <button type="button" class="t-down"  data-key="down"  aria-label="Down">&#9660;</button>
    <button type="button" class="t-a"     data-key="ok"    aria-label="Confirm">A</button>
    <button type="button" class="t-b"     data-key="back"  aria-label="Back">B</button>
    <button type="button" class="t-start" data-key="start" aria-label="Menu">MENU</button>
  </div>
</div>

<script src="sound.js?v=1"></script>
<script src="dex.js?v=1"></script>
<script src="sprites.js?v=1"></script>
<script src="art.js?v=1"></script>
<script src="game.js?v=1"></script>
</body>
</html>
