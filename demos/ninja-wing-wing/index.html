<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="dark" />
<title>Ninja Wing Wing</title>
<link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
<div id="wrap">
  <!-- Everything, menus and all, is drawn into this canvas with the game's own
       pixel font, so text and art stay on one grid at every size. -->
  <canvas id="c" width="320" height="180"></canvas>

  <div id="touch" aria-hidden="true">
    <button type="button" class="t-up"    data-key="up"    aria-label="Aim up">&#9650;</button>
    <button type="button" class="t-left"  data-key="left"  aria-label="Left">&#9664;</button>
    <button type="button" class="t-right" data-key="right" aria-label="Right">&#9654;</button>
    <button type="button" class="t-down"  data-key="down"  aria-label="Aim down">&#9660;</button>
    <button type="button" class="t-flap"  data-key="flap"  aria-label="Flap">FLAP</button>
    <button type="button" class="t-atk"   data-key="atk"   aria-label="Attack">HIT</button>
    <button type="button" class="t-star"  data-key="star"  aria-label="Throw shuriken">STAR</button>
    <button type="button" class="t-block" data-key="block" aria-label="Block">BLOCK</button>
  </div>

  <!-- The only DOM the game uses beyond the canvas: typing a room code needs a
       real input, or phone keyboards will not come up. -->
  <div id="codebox" hidden>
    <label for="code">Room code</label>
    <input id="code" maxlength="5" autocomplete="off" autocapitalize="characters"
           spellcheck="false" inputmode="text" />
    <div class="row">
      <button type="button" id="code-go">Join</button>
      <button type="button" id="code-cancel">Back</button>
    </div>
    <p id="code-msg"></p>
  </div>
</div>

<script src="fighters.js?v=6"></script>
<script src="stages.js?v=6"></script>
<script src="game.js?v=6"></script>
</body>
</html>
